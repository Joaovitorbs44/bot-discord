name: Synchronize and validate npm lockfile
on:
  push:
    branches:
      - feature/invi-six-pro-v2-premium-glass
    paths:
      - '.github/workflows/sync-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-test:
    if: github.ref == 'refs/heads/feature/invi-six-pro-v2-premium-glass'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate canonical lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install directly from lockfile
        run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/app/index.js
          node --check scripts/backup-sqlite.js
          for file in src/services/*Sessions.js src/services/*Panels.js src/services/multiLobbyQueue.js src/services/multiLobbyMigration.js; do
            node --check "$file"
          done
      - name: Commit validated lockfile to feature branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize validated npm lockfile"
          git push origin HEAD:feature/invi-six-pro-v2-premium-glass
